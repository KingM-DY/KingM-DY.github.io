# kingm-site Nginx 站点配置（优化版：gzip + 分级缓存）
# 部署位置：/etc/nginx/conf.d/kingm-site.conf
# 适用：Vite 构建的 SPA 静态站（dist/ 传到 /var/www/kingm-site）

server {
    listen 80;
    server_name _;   # 备案通过后改成你的域名，如 kingm.site
    root /var/www/kingm-site;
    index index.html;

    # ---------- gzip 压缩（显著减少出流量，直接省流量费）----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ---------- HTML 入口：不缓存 ----------
    # 每次都向服务器确认，保证你发新版后访客立刻看到，不会卡在旧页面
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------- Vite 构建产物：永久缓存 ----------
    # 文件名带 hash（如 /assets/index-a1b2c3.js），内容不变 URL 就不变
    # 用 ^~ 提升优先级，盖过下面的正则匹配
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- 其他静态资源：长缓存（30 天）----------
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---------- SPA 路由回退（刷新子路由不 404）----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
